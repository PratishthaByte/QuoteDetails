    function formatDateToMDY(inputDate) {
      const date = new Date(inputDate);
      const month = String(date.getMonth() + 1).padStart(2, '0'); // Month is 0-indexed
      const day = String(date.getDate()).padStart(2, '0');
      const year = date.getFullYear();
      return `${month}-${day}-${year}`;
    }

    function calculateGroupTotalAmount(products) {
      console.log("Products in Group:-------------------✔️✔️", products);
      return products.reduce((total, product) => {
        // console.log("Product:Net_Total-------------------",product.Net_Total );
        return total + (product.Total_After_Discount || 0);
      }, 0);
    }

    function groupProductsByGroupName(productDetails) {
      const grouped = {};
      productDetails.forEach((product) => {
        const groupName = product.Group || "Ungrouped";
        if (!grouped[groupName]) {
          grouped[groupName] = [];
        }
        grouped[groupName].push(product);
      });
      return grouped;
    }
    function calculateGroupTotalAmount(products) {
      return products.reduce((total, product) => {
        return total + (product.Net_Total || 0);
      }, 0);
    }

    function groupProductsByGroupName(productDetails) {
      const grouped = {};

    function calculateGroupTotal(products) {

      const container = document.getElementById('productTableContainer');
      container.innerHTML = '';

      let grandTotal = 0;

      Object.keys(groupedProducts).forEach(groupName => {

        grandTotal += groupTotal;

        const groupSection = document.createElement('div');
        groupSection.className = 'group-section';
        groupSection.innerHTML = `
            <div class="group-header">
                <h4>${groupName}</h4>
            </div>

                        <th style="border: 1px solid black; border-collapse: collapse;font-size: 12px; padding:5px 10px;background-color: #1a4c6f !important; color: #fff;">Quantity</th>
                        <th style="border: 1px solid black; border-collapse: collapse;font-size: 12px; padding:5px 10px;background-color: #1a4c6f !important; color: #fff;">UOM</th>
                        <th style="border: 1px solid black; border-collapse: collapse;font-size: 12px; padding:5px 10px;background-color: #1a4c6f !important; color: #fff;">Unit Price</th>
                        <th style="border: 1px solid black; border-collapse: collapse;font-size: 12px; padding:5px 10px;background-color: #1a4c6f !important; color: #fff;">Ext. Price</th>
                    </tr>
                </thead>
                <tbody class="product-rows">
                    ${groupedProducts[groupName].map((item, index) => `
                        <tr class="avoid-break">
                            <td style="border: 1px solid black; border-collapse: collapse;font-size: 12px; padding:5px 10px;">${index + 1}</td>
                            <td style="border: 1px solid black; border-collapse: collapse;font-size: 12px; padding:5px 10px;">${item.Product_Name?.name || 'N/A'}</td>
                            <td style="border: 1px solid black; border-collapse: collapse;font-size: 12px; padding:5px 10px;">${item.Quantity || 0}</td>
                            <td style="border: 1px solid black; border-collapse: collapse;font-size: 12px; padding:5px 10px;">${item.UOM || 'N/A'}</td>
                            <td style="border: 1px solid black; border-collapse: collapse;font-size: 12px; padding:5px 10px;">${item.List_Price?.toFixed(2) || '0.00'}</td>
                            <td style="border: 1px solid black; border-collapse: collapse;font-size: 12px; padding:5px 10px;">${(item.Total_After_Discount).toFixed(2)}</td>
                        </tr>
                    `).join('')}
                </tbody>
            </table>
            <div class="group-total" style="text-align: right;">
                <strong>Group Total: $${groupTotal.toFixed(2)}</strong>
            </div>
        `;

        container.appendChild(groupSection);
      });

      // Update grand total
      document.getElementById('group-total-value').textContent = grandTotal.toFixed(2);

<script>
 
    
  document.getElementById("generateUploadPdfButton").addEventListener("click", function() {
    const htmlContent = document.getElementById("pdfContent").innerHTML;
    const styleTag = `<style>.no-print { display: none; }</style>`; 
    const finalHtmlContent = styleTag + htmlContent;

    document.getElementById("loader").style.display = "block";
    document.getElementById("generateUploadPdfButton").style.display = "none";
    let quoteNum = document.getElementById("quoteNo").innerText.trim();

console.log("quoteNumber----------------",quoteNum);
    $.ajax({
        url: 'https://parecredit.crm-masters.com/createpdf.php', 
        type: 'POST',
        data: { 
            html_content: finalHtmlContent,
            deal_id: deal_ID,
            quoteNumber:document.getElementById("quoteNo").innerText.trim(),
             "Type":"Detail"
        },
        success: function(response) {
            console.log("API Response:", response);
            
            if (response.success) {
                Swal.fire({
                    title: "Success!",
                    text: response.message,
                    icon: "success",
                    confirmButtonText: "OK",
                }).then(() => {
                    ZOHO.CRM.UI.Popup.close();
                });
            } else {
                Swal.fire({
                    title: "Error!",
                    text: response.error || "Failed to attach document",
                    icon: "error",
                    confirmButtonText: "OK",
                });
            }
        },
        error: function(xhr, status, error) {
            Swal.fire({
                title: "Error!",
                text: "Failed to communicate with server",
                icon: "error",
                confirmButtonText: "OK",
            });
            console.error("AJAX Error:", error);
        },
        complete: function() {
            document.getElementById("loader").style.display = "none";
        }
    });
});

</script>
